# Runs the whole app on your laptop: database, API and website.
#   1. Copy backend/.env.example to backend/.env and put your key in it
#   2. docker compose up --build
#   3. Open http://localhost:3000
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reportsaathi
      POSTGRES_PASSWORD: reportsaathi
      POSTGRES_DB: reportsaathi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reportsaathi"]
      interval: 2s
      retries: 15

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      RS_DATABASE_URL: postgresql+psycopg://reportsaathi:reportsaathi@db:5432/reportsaathi
      RS_UPLOAD_DIR: /app/uploads
      # A development encryption key is created here on first start, kept apart from the files.
      RS_MASTER_KEY_FILE: /app/keys/master-key
    volumes:
      - uploads:/app/uploads
      - keys:/app/keys
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        # The website forwards /api/* to the API, so the browser only ever talks to one address.
        API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
  keys:
