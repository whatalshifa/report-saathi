name: Keep the API awake

# Render's free plan puts the API to sleep after 15 quiet minutes, and waking it takes
# up to a minute. A visit every 10 minutes keeps it awake for visitors. One always-on
# service fits inside the free plan's 750 hours a month.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the API if it is healthy
        run: curl --silent --show-error --fail --retry 3 --retry-delay 20 --max-time 90 "${API_HEALTH_URL:-https://report-saathi-api.onrender.com/api/health}"
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
