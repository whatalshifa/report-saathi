name: probe-rs
on: push
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run live probe
        working-directory: probe
        run: |
          mkdir -p probe-out
          npm init -y >/dev/null && npm i -D @playwright/test@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          npx playwright test || true
          for f in probe-out/*.txt; do echo "== $f"; cat "$f"; echo; done
      - name: Save results
        run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -f probe/probe-out && git commit -m "probe output" && git push
